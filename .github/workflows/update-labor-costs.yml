name: Update Sheet (Materials + Labor)

on:
  schedule:
    # Runs at 06:00 UTC on the 2nd of every month
    - cron: '0 6 2 * *'
  workflow_dispatch: {} # allows manual "Run workflow" button in GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies (including Playwright browser)
        run: npm install

      - name: Run unified scraper
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node unified-scrape.js
