name: Update Labor Costs

on:
  schedule:
    # Runs at 06:00 UTC on the 2nd of every month
    - cron: '0 6 2 * *'
  workflow_dispatch: {} # allows manual "Run workflow" button in GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (including Playwright browser)
        run: npm install

      - name: Run scraper
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scrape.js
